<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site</title>
    <link rel="stylesheet" href="./assets/css/home/estilohome.css">
    <script src="./assets/js/menu-hamburguer.js"></script>
    <script src="./assets/js/home.js" type="module"></script>
    <script src="https://kit.fontawesome.com/f0241f3367.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="logo">M</div>
        <h1 class="titulo">Meu Site de Notícias</h1>
        <div class="menu-hamburguer" onclick="alternarVisualizacaoDoMenuLateral()">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i id="icone" class="fa-solid fa-bars"></i>
        </div>
    </header>
    <section>
        <nav>
            <ul class="menu-lateral">
                <li id="opcao-noticia">
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                            <i class="fa-solid fa-newspaper"></i>
                            </div>
                            <div class="rotulo">Notícia</div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                            <i class="fa-solid fa-envelope"></i>
                            </div>
                            <div class="rotulo">Mensagem</div>
                            <div class="icone-final">
                            <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                            <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="rotulo">Perfil</div>
                            <div class="icone-final">
                            <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="./index.html">
                        <div class="opcao">
                            <div class="icone-inicial">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            </div>
                            <div class="rotulo">Sair</div>
                            <div class="icone-final">
                            <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>                
            </ul>
        </nav>    
        <main id="noticias" class="container">
        </main>
    </section>
    <footer>&copy, Meu site, 2026</footer>
</body>

</html>
