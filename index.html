<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Notícias</title>
    <link rel="stylesheet" href="./assets/css/login/estilo.css">
    <script src="./assets/js/login.js" type="module"</script>
    <script src="https://kit.fontawesome.com/f0241f3367.js" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">M</div>
        <h1 class="titulo">Meu Site de Notícias</h1>
    </header>
    <div class="container">
        <h1>Login</h1>
        <form>
            <div class="input-grupo">
                <i class="fas fa-envelope icone"></i>
                <input id="email" type="email" placeholder="Informe seu e-mail" />
            </div>
            <div class="input-grupo">
                <i class="fas fa-lock icone"></i>
                <input id="senha" type="password" placeholder="Informe sua senha" />
            </div>
            <button><i class="fas fa-sign-in-alt"></i>Entrar</button>
        </form>
        <div class="links-auxiliares">
            <a href="#">Esqueceu a senha?</a>
            <span>-</span>
            <a href="#">Registre-se</a>
        </div>
    </div>
</body>
</html>
